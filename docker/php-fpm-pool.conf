; Pool de PHP-FPM de la app: cuántas peticiones PHP se atienden A LA VEZ.
;
; La imagen php:8.3-fpm trae de fábrica pm.max_children = 5: solo 5 peticiones al mismo
; tiempo en todo el servidor. Abrir un módulo dispara varias (la página y, en paralelo, el
; badge de traspasos, el ping de sesión, la sincronización offline, la precarga al pasar el
; ratón...), así que con pocas personas activas a la vez las demás esperaban en fila.
;
; Tamaño medido (2026-09-11): un proceso usa ~20 MB en la mayoría de pantallas y hasta
; ~60 MB en las pesadas (Control de Auditoría al reconstruir su lista, la copia offline).
; 12 procesos en el peor caso son ~720 MB, lo que cabe en un servidor de 2 GB junto a
; MySQL. Con más memoria se puede subir max_children.
;
; Se llama zz-vidalsa.conf al copiarlo (Dockerfile): php-fpm lee php-fpm.d/ en orden
; alfabético y así se aplica DESPUÉS de www.conf y zz-docker.conf de la imagen, que
; también configuran el pool [www]; lo de aquí sobreescribe esos valores.
[www]
pm = dynamic
; Máximo de peticiones PHP simultáneas.
pm.max_children = 12
; Procesos listos al arrancar y que se mantienen esperando: la primera petición tras un
; rato quieto no espera a que nazca un proceso.
pm.start_servers = 4
pm.min_spare_servers = 3
pm.max_spare_servers = 6
; Cada proceso se recicla tras 500 peticiones: devuelve la memoria que haya ido
; acumulando en vez de quedarse con el pico de la pantalla más pesada que atendió.
pm.max_requests = 500
