# Configuración de nginx que corre SOLO durante el arranque del contenedor.
#
# POR QUÉ EXISTE: al desplegar, EasyPanel levanta el contenedor nuevo y docker/start.sh
# se toma cerca de un minuto en migrar y cachear antes de que la app pueda responder.
# Durante ese rato NADIE escuchaba en el puerto 80, así que el proxy de EasyPanel no
# tenía a quién preguntar y enseñaba su propia pantalla genérica de "página no
# disponible". Con esto nginx contesta desde el primer segundo con el aviso de la
# empresa, y start.sh la cambia por docker/nginx.conf (recarga en caliente, sin soltar
# el puerto) en cuanto la app está lista.
#
# NO sirve PHP a propósito: mientras esto está activo php-fpm puede estar todavía
# arrancando, y la gracia es no depender de él.

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;

    # El aviso no se guarda en ningún lado: cuando la app vuelva, la siguiente
    # petición tiene que llegar a la app, no a una copia cacheada del cartel.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    # Los buscadores y los proxies entienden que es temporal y cuándo reintentar.
    add_header Retry-After 20 always;

    # Estáticos que la propia página necesita (logo, tipografía, favicon). Van
    # directos desde disco: son archivos, no requieren la app.
    location ^~ /images/ { try_files $uri =404; }
    location ^~ /css/    { try_files $uri =404; }
    location ^~ /fonts/  { try_files $uri =404; }
    location = /favicon.png { try_files $uri =404; }

    # El archivo del aviso. La coincidencia exacta gana a `location /`, así que se
    # sirve tal cual —tanto por el error_page de abajo como si alguien escribe la
    # URL a mano—. No se marca `internal`: eso dejaría esta única dirección
    # devolviendo el 404 pelado de nginx, justo lo que se quiere evitar.
    location = /mantenimiento.html {
        try_files $uri =404;
    }

    # Todo lo demás —páginas, AJAX, API— responde 503. Es el código correcto para
    # "vuelvo en un rato": el navegador no lo cachea y no rompe el historial.
    location / {
        return 503;
    }

    error_page 503 /mantenimiento.html;
}
