upload_max_filesize = 50M
post_max_size = 50M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; OPcache: la extension se habilita en el Dockerfile (docker-php-ext-enable
; opcache); aqui van solo los ajustes que cambian algo. Guarda el bytecode
; compilado en memoria para que PHP no reparsee en cada peticion los ~700
; archivos que carga el framework.
;
; NO se tocan memory_consumption (128M), max_accelerated_files (10000) ni
; interned_strings_buffer (8M): los defectos sobran para los ~700 archivos
; por peticion, y subirlos solo reservaria RAM del contenedor sin ganancia.
;
; validate_timestamps TAMPOCO se toca (se queda en 1, el defecto). Ponerlo en 0
; se midio y NO da ninguna mejora (el SO ya cachea los stat()), pero rompe los
; hotfix: un archivo editado dentro del contenedor seguiria sirviendo la version
; vieja hasta reiniciar php-fpm. Si alguien lo ve como "optimizacion pendiente",
; ya se probo y no lo es.
opcache.enable=1

; Las rutas resueltas se recuerdan 10 min en vez de 2. Ajuste convencional y sin
; riesgo (en el contenedor las rutas no se mueven); mejora pequena, no medida.
; El tamano NO se toca: realpath_cache_size ya viene en 4096K por defecto.
realpath_cache_ttl=600
