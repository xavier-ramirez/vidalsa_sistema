[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Programador de tareas de Laravel (routes/console.php): hoy corre la compresion nocturna
; de PDF (docs:comprimir). Como www-data, el mismo usuario que php-fpm, para que lo que
; escriba en storage/ lo pueda leer la app.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Tiempo real (ver config/broadcasting.php): el servidor de WebSockets, que escucha solo por
; dentro (127.0.0.1:8080; nginx le pasa /app), y el vigía que avisa en cuanto el registro de
; cambios crece. Los dos reintentan solos mientras la base todavía no responde al arrancar.
[program:reverb]
command=php /var/www/html/artisan reverb:start
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:avisar-cambios]
command=php /var/www/html/artisan cambios:avisar
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
