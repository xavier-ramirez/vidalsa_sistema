server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;

    # Compresión: HTML/JS/CSS/JSON se reducen ~70-80%. Clave en conexiones lentas
    # (la navegación SPA descarga la página completa en cada módulo). text/html
    # siempre se comprime con gzip on; no va en gzip_types.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json application/geo+json image/svg+xml text/plain application/xml font/ttf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /sw.js SIEMPRE por Laravel: la ruta inyecta __CACHE_VERSION__ y headers
    # no-cache (la plantilla vive en resources/, no hay archivo físico). Esta
    # location exacta gana a la regex de .js de abajo — sin ella, la respuesta
    # ruteada saldría con expires 365d + immutable pisando el no-cache.
    location = /sw.js {
        rewrite ^ /index.php last;
    }

    # JS/CSS/fuentes: caché inmutable de 1 año. Seguro porque llevan cache-buster
    # ?v=filemtime (un cambio de archivo cambia la URL).
    location ~* \.(?:js|css|woff2?|ttf|map)$ {
        try_files $uri /index.php?$query_string;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # GeoJSON del módulo /mapa (estados 1.2 MB, municipios 1.9 MB). nginx NO mapea
    # la extensión .geojson en mime.types → sin este bloque se sirve como
    # application/octet-stream, que queda FUERA de gzip_types (se baja sin comprimir
    # y sin caché, ~3 MB por visita). Forzamos application/geo+json (ya incluido en
    # gzip_types → ~85% menos) y caché inmutable, segura porque las URLs llevan
    # cache-buster ?v=filemtime (un cambio de archivo cambia la URL).
    location ~* \.geojson$ {
        try_files $uri /index.php?$query_string;
        default_type application/geo+json;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Imágenes: sin cache-buster en muchas referencias → caché corta (no
    # immutable) para que un reemplazo con el mismo nombre se refleje en días.
    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico)$ {
        try_files $uri /index.php?$query_string;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
